[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openwaiver"
version = "0.1.0"
description = "Local-first, cross-tool EDA waiver lifecycle management with fail-closed reviews"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "OpenWaiver contributors"}]
keywords = ["eda", "waiver", "drc", "cdc", "lint", "verification"]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7", "defusedxml>=0.7.1,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "build>=1.2,<2"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
openwaiver = "openwaiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwaiver = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
