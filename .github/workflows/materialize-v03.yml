name: Verify and integrate reviewed v0.3 source
on:
  push:
    branches: [feature/physical-context-federation-v0.3]
    paths: [.github/workflows/materialize-v03.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'ajayasai/OpenWaiver'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/physical-context-federation-v0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify source bytes and guarded integration anchors
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path('scripts/v03-transfer-digests.json').read_text())
          for path, sha in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == sha, (path, actual, sha)
          print('Verified', len(expected), 'transferred source/test assets')
          PY
          python scripts/apply_v03.py
      - run: python -m pip install -e '.[dev,physical]'
      - name: Record native environment
        run: |
          mkdir -p validation-results
          python - <<'PY'
          import json, platform
          from importlib.metadata import version
          from pathlib import Path
          info = {'python':platform.python_version(), 'klayout':version('klayout'), 'PyJWT':version('PyJWT')}
          Path('validation-results/environment.json').write_text(json.dumps(info, indent=2))
          print(info)
          PY
      - run: python -m pytest --cov=openwaiver --cov-fail-under=90 --cov-report=term-missing --cov-report=json:validation-results/coverage.json --junitxml=validation-results/tests.xml
      - run: node --check src/openwaiver/static/physical.js && python -m compileall -q src tests scripts
      - name: Commit only the verified core integration to this branch
        run: |
          git config user.name 'OpenWaiver publication bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/openwaiver/models.py src/openwaiver/service.py src/openwaiver/api.py src/openwaiver/__init__.py pyproject.toml README.md CHANGELOG.md
          git commit -m 'Integrate v0.3 physical evidence and pinned federated authentication after regression checks'
          git push origin HEAD:feature/physical-context-federation-v0.3
      - name: Retain public-source validation results only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-integration-validation
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
