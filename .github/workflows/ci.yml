name: Python, browser and native adapter checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,physical]'
      - name: Record native dependency versions
        run: |
          mkdir -p validation-results
          python - <<'PY'
          import json, platform
          from pathlib import Path
          from importlib.metadata import version
          data = {'python': platform.python_version(), 'klayout': version('klayout'), 'PyJWT': version('PyJWT'), 'cryptography': version('cryptography')}
          Path('validation-results/environment.json').write_text(json.dumps(data, indent=2))
          print(data)
          PY
      - run: python -m pytest --tb=short --cov=openwaiver --cov-fail-under=90 --cov-report=term-missing --cov-report=json:validation-results/coverage.json --junitxml=validation-results/tests.xml
      - name: Require native and release tests to execute, not skip
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('validation-results/tests.xml').getroot()
          native = [x for x in root.iter('testcase') if x.get('classname', '').endswith('test_physical_native')]
          release = [x for x in root.iter('testcase') if x.get('classname', '').endswith('test_release_assurance')]
          assert len(native) >= 23, 'native conformance cases missing'
          assert len(release) >= 71, 'release assurance cases missing'
          assert not list(root.iter('skipped')), 'release regression tests must not silently skip'
          assert not list(root.iter('failure')) and not list(root.iter('error'))
          print('Native cases executed:', len(native), 'Release cases executed:', len(release))
          PY
      - run: python -m compileall -q src tests scripts
      - run: for source in src/openwaiver/static/*.js; do node --check "$source"; done
      - run: python -m build
      - name: Verify isolated installed wheel, release and physical entry points
        run: |
          python -m venv /tmp/openwaiver-wheel-check
          /tmp/openwaiver-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/openwaiver-wheel-check/bin/python - <<'PY'
          from importlib.resources import files
          from importlib.metadata import version
          assert version('openwaiver') == '0.4.0'
          for asset in ['physical.html', 'physical.js', 'releases.html', 'releases.js', 'releases.css']:
              assert files('openwaiver').joinpath('static/' + asset).is_file(), asset
          from openwaiver.federation import validate_access_token
          from openwaiver.physical import PhysicalManifest
          from openwaiver.assurance import ReleaseContract
          from openwaiver.capsule import verify_capsule
          PY
          /tmp/openwaiver-wheel-check/bin/openwaiver-physical --help
          /tmp/openwaiver-wheel-check/bin/openwaiver-release --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: python-${{ matrix.python }}-validation
          path: |
            validation-results/
            dist/
          retention-days: 14
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,browser,physical]'
      - run: playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py --output validation-results/live-browser
      - run: python scripts/offline_smoke.py --output validation-results/offline-browser
      - run: python scripts/physical_browser_smoke.py --output validation-results/physical-browser
      - run: python scripts/release_browser_smoke.py --output validation-results/release-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-validation
          path: validation-results/
          retention-days: 14
          if-no-files-found: error
  native-verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: python -m pip install -e '.[physical]'
      - run: python scripts/native_verilator.py
      - run: python scripts/native_release_rehearsal.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-verilator-validation
          path: |
            validation-results/native-verilator.json
            validation-results/native-release.json
          retention-days: 14
          if-no-files-found: error
