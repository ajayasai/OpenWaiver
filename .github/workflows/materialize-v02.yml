name: Verify and materialize reviewed v0.2 source
on:
  push:
    branches: [feature/scoped-review-evidence-v0.2]
    paths: [.github/workflows/materialize-v02.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-source:
    if: github.repository == 'ajayasai/OpenWaiver' && github.ref == 'refs/heads/feature/scoped-review-evidence-v0.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply only explicit reviewed paths and verify all source digests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          directory = pathlib.Path('.publication/openwaiver-v02')
          manifest = json.loads((directory/'manifest.json').read_text())
          assert len(manifest) == 43
          root_files = {'.gitignore', 'CHANGELOG.md', 'README.md', 'SECURITY.md', 'pyproject.toml'}
          for name, expected in manifest.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in root_files or path.parts[0] in {'src', 'tests', 'scripts', 'docs'}
              assert re.fullmatch('[0-9a-f]{64}', expected)
          patches = sorted(directory.glob('*.patch'))
          assert [p.name for p in patches] == [f'{n:02}.patch' for n in range(1, 10)]
          text = ''.join(p.read_text() for p in patches)
          # Normalize an indented diff header introduced during text transport.
          # No source lines are normalized: the final byte hashes must match exactly.
          text = re.sub(r'^ diff --git ', 'diff --git ', text, flags=re.MULTILINE)
          paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', text, re.MULTILINE)
          assert len(paths) == len(manifest) and {a for a,b in paths} == set(manifest)
          assert all(a == b for a,b in paths)
          subprocess.run(['git', 'apply', '--check', '-'], input=text.encode(), check=True)
          subprocess.run(['git', 'apply', '-'], input=text.encode(), check=True)
          mismatches = []
          for name, expected in manifest.items():
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  mismatches.append({'path': name, 'expected': expected, 'actual': actual})
          assert not mismatches, json.dumps(mismatches, indent=2)
          print('VERIFIED: all 43 resulting source/documentation/test files match locally tested SHA-256 hashes.')
          subprocess.run(['git', 'add', '--', *manifest.keys()], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\x00').split('\x00')
          assert set(staged) == set(manifest)
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=openwaiver --cov-fail-under=90 --cov-report=term
      - run: node --check src/openwaiver/static/app.js && node --check src/openwaiver/static/plans.js
      - name: Commit verified source to this feature branch without force-pushing
        shell: bash
        run: |
          git config user.name 'OpenWaiver publication bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement v0.2 scoped reviews, indexed matching and independently verifiable evidence'
          git push origin HEAD:refs/heads/feature/scoped-review-evidence-v0.2
